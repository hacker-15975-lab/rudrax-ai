<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>rudrax</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg-color: #0c0d12;
  --surface-color: rgba(20, 22, 31, 0.75);
  --surface-variant: rgba(32, 35, 50, 0.5);
  --glass-border: rgba(255, 255, 255, 0.06);
  --primary-accent: linear-gradient(135deg, #3b82f6, #1d4ed8);
  --primary-color: #3b82f6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --bot-msg-bg: rgba(30, 41, 59, 0.4);
  --user-msg-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
  --radius-xl: 28px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

[data-theme="light"] {
  --bg-color: #f4f6fa;
  --surface-color: rgba(255, 255, 255, 0.8);
  --surface-variant: rgba(226, 232, 240, 0.7);
  --glass-border: rgba(0, 0, 0, 0.05);
  --primary-accent: linear-gradient(135deg, #2563eb, #1d4ed8);
  --primary-color: #2563eb;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --bot-msg-bg: rgba(241, 245, 249, 0.9);
  --user-msg-bg: linear-gradient(135deg, #3b82f6, #2563eb);
}

[data-theme="cyberpunk"] {
  --bg-color: #07020d;
  --surface-color: rgba(15, 4, 32, 0.75);
  --surface-variant: rgba(38, 12, 77, 0.5);
  --glass-border: rgba(244, 63, 94, 0.2);
  --primary-accent: linear-gradient(135deg, #f43f5e, #be123c);
  --primary-color: #f43f5e;
  --text-main: #f1f5f9;
  --text-muted: #fda4af;
  --bot-msg-bg: rgba(76, 5, 25, 0.3);
  --user-msg-bg: linear-gradient(135deg, #e11d48, #9f1239);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
}

body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  overflow: hidden;
  transition: background-color 0.4s ease;
}

::-webkit-scrollbar {
  width: 5px;
}
::-webkit-scrollbar-thumb {
  background: var(--glass-border);
  border-radius: 10px;
}

.glass {
  background: var(--surface-color);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
}

.sidebar {
  position: fixed;
  top: 16px; left: 16px; bottom: 16px;
  width: 320px;
  transform: translateX(-120%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 24px;
  overflow-y: auto;
  z-index: 1000;
  border-radius: var(--radius-xl);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.sidebar.open { transform: translateX(0); }

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.sidebar h3 {
  margin: 0;
  font-weight: 600;
  font-size: 18px;
}

.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin: 20px 0 10px auto;
  font-weight: 700;
}

.input-box {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--surface-variant);
  color: var(--text-main);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.input-box:focus { border-color: var(--primary-color); }

.model-list-container {
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 8px;
  background: var(--surface-variant);
  margin-bottom: 12px;
}

.model-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-main);
}
.model-item:hover { background: rgba(255,255,255,0.05); }
.model-item button {
  background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px;
}

.btn-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.action-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--surface-variant);
  color: var(--text-main);
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.2s;
  border: 1px solid var(--glass-border);
}
.action-btn:hover { background: rgba(255,255,255,0.1); }

.save-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary-accent);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 999;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.main { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  z-index: 500;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(12, 13, 18, 0.4);
}

.header-left { display: flex; align-items: center; }

.menu-btn, .theme-btn {
  background: var(--surface-variant);
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  cursor: pointer;
  padding: 10px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}
.menu-btn:active, .theme-btn:active { transform: scale(0.92); }

.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-left: 16px;
  background: linear-gradient(135deg, var(--text-main), var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Custom Stylish Dropdown */
.custom-dropdown {
  position: relative;
  min-width: 200px;
  max-width: 280px;
}
.dropdown-trigger {
  background: var(--surface-color);
  border: 1px solid var(--glass-border);
  padding: 8px 16px;
  border-radius: var(--radius-xl);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--surface-color);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  max-height: 260px;
  overflow-y: auto;
  width: max-content;
  min-width: 220px;
  max-width: 300px;
  display: none;
  z-index: 600;
  padding: 6px;
}
.dropdown-menu.show { display: block; }
.dropdown-item {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.2s;
}
.dropdown-item:hover { background: var(--surface-variant); }
.dropdown-item.selected { background: var(--primary-accent); color: #fff; }

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: 140px;
}

.msg {
  max-width: 80%;
  padding: 14px 20px;
  border-radius: var(--radius-xl);
  line-height: 1.6;
  font-size: 15px;
  word-wrap: break-word;
  animation: scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-origin: top left;
}
/* Eliminate stream flickering block reflows */
.msg * { overflow-anchor: none; }
.msg p { margin: 0 0 12px 0; }
.msg p:last-child { margin: 0; }
.msg pre { 
  background: rgba(0,0,0,0.25); 
  padding: 14px; 
  border-radius: var(--radius-sm); 
  overflow-x: auto; 
  border: 1px solid rgba(255,255,255,0.05);
  margin: 12px 0;
}
.msg code { font-family: monospace; background: rgba(0,0,0,0.2); padding: 3px 6px; border-radius: 6px; font-size: 13px; }
.msg pre code { background: transparent; padding: 0; font-size: 13px; }

.user {
  align-self: flex-end;
  background: var(--user-msg-bg);
  color: #fff;
  border-bottom-right-radius: 6px;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
  transform-origin: top right;
}
.bot {
  align-self: flex-start;
  background: var(--bot-msg-bg);
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  border-bottom-left-radius: 6px;
}

@keyframes scaleUp {
  0% { opacity: 0; transform: scale(0.96) translateY(8px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.input-area-wrapper {
  position: absolute;
  bottom: 0; left: 0; width: 100%;
  padding: 20px 24px 10px 24px;
  background: linear-gradient(transparent, var(--bg-color) 30%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 100;
}

.input-wrapper {
  display: flex;
  align-items: center;
  padding: 8px 10px 8px 20px;
  border-radius: 32px;
  width: 100%;
  max-width: 800px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.25);
  background: var(--surface-color);
  border: 1px solid var(--glass-border);
}

.icon-btn {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 10px;
  border-radius: 50%;
  transition: 0.2s;
}
.icon-btn:hover { color: var(--text-main); background: var(--surface-variant); }

.input-field {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--text-main);
  font-size: 15px;
  padding: 8px 12px;
}
.input-field::placeholder { color: var(--text-muted); }

.send-btn {
  background: var(--text-muted);
  color: var(--bg-color);
  border: none; border-radius: 50%;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0.4;
  pointer-events: none;
}
.send-btn.active {
  opacity: 1;
  pointer-events: auto;
  background: var(--primary-color);
  color: #fff;
  transform: scale(1.05);
}

.image-preview-container {
  display: none;
  position: relative;
  margin-right: 12px;
}
.image-preview-container img {
  width: 40px; height: 40px; object-fit: cover; border-radius: 10px; border: 1px solid var(--glass-border);
}
.img-clear-btn {
  position: absolute; top: -6px; right: -6px;
  background: #ef4444; color: white; border: none; border-radius: 50%;
  width: 16px; height: 16px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
}

.image-preview-msg {
  max-width: 260px;
  border-radius: var(--radius-md);
  margin-top: 10px;
  display: block;
}

.copyright-text {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 12px;
  cursor: pointer;
  font-weight: 500;
  letter-spacing: 0.3px;
  transition: color 0.3s ease;
  user-select: none;
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="sidebar glass" id="sidebar">
  <div class="sidebar-header">
    <h3>Configuration</h3>
    <button class="menu-btn" onclick="toggleSidebar(false)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="createNewChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
    <button class="action-btn" style="color:#ef4444;" onclick="deleteCurrentChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Delete Chat
    </button>
  </div>

  <div class="section-label">Manage Models</div>
  <div class="model-list-container" id="sidebarModelList"></div>
  <div style="display:flex; gap:6px; margin-bottom:16px;">
    <input class="input-box" id="newModelInput" placeholder="Add custom OpenRouter model ID..." style="margin:0;">
    <button class="action-btn" onclick="addNewModel()" style="flex:initial; padding: 0 14px;">Add</button>
  </div>

  <div class="section-label">System Architecture</div>
  <textarea class="input-box" id="systemPrompt" rows="3" placeholder="System Behavior Instructions..."></textarea>
  
  <div class="section-label">API Access Credentials</div>
  <input class="input-box" id="api1" placeholder="Primary OpenRouter Key" type="password">
  <input class="input-box" id="api2" placeholder="Secondary Key (Optional)" type="password">
  <input class="input-box" id="api3" placeholder="Fallback Key (Optional)" type="password">

  <button class="save-btn" onclick="saveSettings()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
    Apply Configuration
  </button>
</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="hamburger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="logo">rudrax</div>
    </div>
    
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="custom-dropdown">
        <div class="dropdown-trigger" id="dropdownTrigger">
          <span id="selectedModelLabel">Loading models...</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="dropdown-menu" id="dropdownMenu"></div>
      </div>

      <button class="theme-btn" id="themeToggle" title="Change Layout Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="input-area-wrapper">
    <div class="input-wrapper">
      <button class="icon-btn" onclick="document.getElementById('imageUpload').click()" title="Attach Visual Context">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      </button>
      <input type="file" id="imageUpload" accept="image/*" style="display:none">
      
      <div class="image-preview-container" id="imgPrevContainer">
        <img id="imgPrevSource" src="">
        <button class="img-clear-btn" onclick="clearImageAttachment()">×</button>
      </div>

      <input type="text" class="input-field" id="userInput" placeholder="Ask anything to rudrax...">
      <button class="send-btn" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    
    <div class="copyright-text" id="copyright">All Rights Reserved © Tapojit Mondal</div>
  </div>
</div>

<script>
// Deep System Defaults
const defaultModels = [
  "poolside/laguna-m.1:free", "poolside/laguna-xs.2:free",
  "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "openrouter/owl-alpha",
  "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free",
  "moonshotai/kimi-k2.6:free", "deepseek/deepseek-v4-flash:free",
  "nvidia/nemotron-nano-12b-v2-vl:free", "nvidia/nemotron-3-nano-30b-a3b:free",
  "liquid/lfm-2.5-1.2b-instruct:free", "liquid/lfm-2.5-1.2b-thinking:free",
  "nvidia/nemotron-3-super-120b-a12b:free", "openai/gpt-oss-20b:free",
  "openai/gpt-oss-120b:free", "nvidia/nemotron-nano-9b-v2:free",
  "qwen/qwen3-next-80b-a3b-instruct:free", "meta-llama/llama-3.2-3b-instruct:free",
  "meta-llama/llama-3.3-70b-instruct:free", "cognitivecomputations/dolphin-mistral-24b-venice-edition:free",
  "qwen/qwen3-coder:free", "z-ai/glm-4.5-air:free",
  "nousresearch/hermes-3-llama-3.1-405b:free", "nvidia/llama-nemotron-embed-vl-1b-v2:free"
];

const themes = ["dark", "light", "cyberpunk"];
let currentThemeIndex = 0;

let appSettings = {
  models: [...defaultModels],
  selectedModel: defaultModels[0],
  system: "You are rudrax, an advanced helpful AI companion.",
  keys: ["", "", ""]
};

let currentImage = null;

// DOM Cache Elements
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const hamburger = document.getElementById('hamburger');
const chatContainer = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const imageUpload = document.getElementById('imageUpload');
const dropdownTrigger = document.getElementById('dropdownTrigger');
const dropdownMenu = document.getElementById('dropdownMenu');
const selectedModelLabel = document.getElementById('selectedModelLabel');
const copyrightNode = document.getElementById('copyright');
const themeToggleBtn = document.getElementById('themeToggle');

// Dynamic Theme Engine Setup
function initTheme() {
  const savedTheme = localStorage.getItem("rudrax_theme") || "dark";
  currentThemeIndex = themes.indexOf(savedTheme);
  if(currentThemeIndex === -1) currentThemeIndex = 0;
  document.documentElement.setAttribute("data-theme", themes[currentThemeIndex]);
}
themeToggleBtn.onclick = () => {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  const nextTheme = themes[currentThemeIndex];
  document.documentElement.setAttribute("data-theme", nextTheme);
  localStorage.setItem("rudrax_theme", nextTheme);
};

// Cryptographic Safe Store Fallbacks
function encrypt(text) { return btoa(encodeURIComponent(text)); }
function decrypt(text) { return decodeURIComponent(atob(text)); }

// Interactive Sidebar Engine
function toggleSidebar(open) {
  if(open) { sidebar.classList.add('open'); overlay.classList.add('active'); }
  else { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
}
hamburger.onclick = () => toggleSidebar(true);
overlay.onclick = () => { toggleSidebar(false); dropdownMenu.classList.remove('show'); };

// Input Event Triggers
userInput.addEventListener('input', updateSendButtonState);
function updateSendButtonState() {
  if (userInput.value.trim().length > 0 || currentImage) {
    sendBtn.classList.add('active');
  } else {
    sendBtn.classList.remove('active');
  }
}

// Custom Styled UI Dropdown Controller
dropdownTrigger.onclick = (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle('show');
};
document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

function renderDropdown() {
  dropdownMenu.innerHTML = "";
  appSettings.models.forEach(model => {
    const item = document.createElement('div');
    item.className = `dropdown-item ${model === appSettings.selectedModel ? 'selected' : ''}`;
    item.innerText = model.split('/').pop() || model;
    item.title = model;
    item.onclick = () => {
      appSettings.selectedModel = model;
      selectedModelLabel.innerText = model.split('/').pop() || model;
      selectedModelLabel.title = model;
      saveToStorage();
      renderDropdown();
    };
    dropdownMenu.appendChild(item);
  });
  selectedModelLabel.innerText = appSettings.selectedModel.split('/').pop() || appSettings.selectedModel;
  selectedModelLabel.title = appSettings.selectedModel;
}

// Unlimited Model Manager Backend Controllers
function renderSidebarModels() {
  const container = document.getElementById('sidebarModelList');
  container.innerHTML = "";
  appSettings.models.forEach((model, index) => {
    const row = document.createElement('div');
    row.className = "model-item";
    row.innerHTML = `
      <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px;" title="${model}">${model}</span>
      <button onclick="removeModel(${index})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
    `;
    container.appendChild(row);
  });
}

function addNewModel() {
  const input = document.getElementById('newModelInput');
  const val = input.value.trim();
  if(val && !appSettings.models.includes(val)) {
    appSettings.models.push(val);
    input.value = "";
    renderSidebarModels();
    renderDropdown();
  }
}

function removeModel(index) {
  const removed = appSettings.models.splice(index, 1)[0];
  if(appSettings.selectedModel === removed) {
    appSettings.selectedModel = appSettings.models[0] || "";
  }
  renderSidebarModels();
  renderDropdown();
}

// Core Storage Pipelines
function saveSettings() {
  appSettings.system = document.getElementById("systemPrompt").value;
  appSettings.keys = [
    document.getElementById("api1").value.trim(),
    document.getElementById("api2").value.trim(),
    document.getElementById("api3").value.trim()
  ];
  saveToStorage();
  toggleSidebar(false);
}

function saveToStorage() {
  localStorage.setItem("rudrax_v2_configs", encrypt(JSON.stringify(appSettings)));
}

function loadSettings() {
  const data = localStorage.getItem("rudrax_v2_configs");
  if(!data) {
    saveToStorage();
  } else {
    try {
      const parsed = JSON.parse(decrypt(data));
      if (parsed) appSettings = { ...appSettings, ...parsed };
    } catch(e) { console.error("Config verification failed, reverting.", e); }
  }
  
  document.getElementById("systemPrompt").value = appSettings.system || "";
  document.getElementById("api1").value = appSettings.keys[0] || "";
  document.getElementById("api2").value = appSettings.keys[1] || "";
  document.getElementById("api3").value = appSettings.keys[2] || "";
  
  renderSidebarModels();
  renderDropdown();
}

// Chat Memory Functions
function saveChat() { localStorage.setItem("rudrax_v2_chat", chatContainer.innerHTML); }
function loadChat() { chatContainer.innerHTML = localStorage.getItem("rudrax_v2_chat") || ""; }

function createNewChat() {
  if(confirm("Start a clean conversation window?")) {
    chatContainer.innerHTML = "";
    saveChat();
    toggleSidebar(false);
  }
}

function deleteCurrentChat() {
  if(confirm("Permanently erase this chat memory history?")) {
    chatContainer.innerHTML = "";
    saveChat();
    toggleSidebar(false);
  }
}

// Image Context Attachment System
imageUpload.onchange = () => {
  const file = imageUpload.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImage = e.target.result;
    document.getElementById('imgPrevSource').src = currentImage;
    document.getElementById('imgPrevContainer').style.display = "flex";
    updateSendButtonState();
  };
  reader.readAsDataURL(file);
};

function clearImageAttachment() {
  currentImage = null;
  imageUpload.value = "";
  document.getElementById('imgPrevContainer').style.display = "none";
  document.getElementById('imgPrevSource').src = "";
  updateSendButtonState();
}

function addMessage(text, type, isHtml = false) {
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.innerHTML = text; 
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  saveChat();
  return div;
}

// Non-glitchy Streaming Network Implementation
async function streamResponse(model, key, messages, botDiv) {
  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${key}`
    },
    body: JSON.stringify({ model, messages, stream: true })
  });

  if(!response.ok) throw new Error(`HTTP network fault code: ${response.status}`);
  
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let fullText = "";
  let buffer = ""; // Buffers chunk lines safely to prevent markdown engine reflow tearing

  while(true) {
    const {done, value} = await reader.read();
    if(done) break;
    
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split("\n");
    buffer = lines.pop() || ""; // Save fragmented lines to the next cycle evaluation block

    for(let line of lines) {
      line = line.trim();
      if(!line || line === "data: [DONE]") continue;
      if(line.startsWith("data:")) {
        try {
          const json = JSON.parse(line.substring(5).trim());
          const content = json.choices?.[0]?.delta?.content || "";
          if (content) {
            fullText += content;
            // Native Marked parsing without intermediate empty structural elements
            botDiv.innerHTML = marked.parse(fullText);
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        } catch(e) {}
      }
    }
  }
  // Flush remnants out cleanly
  if(buffer.startsWith("data:")) {
     try {
       const json = JSON.parse(buffer.substring(5).trim());
       const content = json.choices?.[0]?.delta?.content || "";
       if (content) { fullText += content; botDiv.innerHTML = marked.parse(fullText); }
     } catch(e){}
  }
}

async function handleSend() {
  let msg = userInput.value.trim();
  if(!msg && !currentImage) return;
  
  userInput.value = "";
  sendBtn.classList.remove('active');

  let displayMsg = msg ? `<p>${msg}</p>` : "";
  if(currentImage) {
    displayMsg += `<img src="${currentImage}" class="image-preview-msg">`;
  }
  
  addMessage(displayMsg, "user", true);
  const botDiv = addMessage('<span style="color:var(--text-muted); font-style:italic;">Processing stream array...</span>', "bot", true);

  const keys = appSettings.keys.filter(k => k);
  if(keys.length === 0) {
    botDiv.innerHTML = "Error: Active access credential key missing. Configure details inside workspace settings.";
    clearImageAttachment();
    return;
  }

  let messages = [];
  if(appSettings.system) {
    messages.push({role: "system", content: appSettings.system});
  }
  
  if(currentImage) {
    messages.push({
      role: "user", 
      content: [
        {type: "text", text: msg || "Perform comprehensive visual data inspection on attached entity."},
        {type: "image_url", image_url: {url: currentImage}}
      ]
    });
  } else {
    messages.push({role: "user", content: msg});
  }

  clearImageAttachment();
  
  let success = false;
  // Dynamic runtime model pipeline fallback execution
  for(let key of keys) {
    try {
      botDiv.innerHTML = ""; 
      await streamResponse(appSettings.selectedModel, key, messages, botDiv);
      success = true;
      break;
    } catch(e) {
      console.warn("Target node rejected stream transaction request. Testing secondary clusters...", e);
    }
  }
  
  if(!success) botDiv.innerHTML = "System Error: Continuous communication pipeline failure across active profiles. Validate OpenRouter connectivity states.";
  saveChat();
}

// Copyright Vector Multi-Color Cycles
const brandColors = ["#3b82f6", "#ec4899", "#10b981", "#f59e0b", "#8b5cf6", "#ef4444", "#06b6d4"];
let activeColorIndex = 0;
copyrightNode.onclick = () => {
  activeColorIndex = (activeColorIndex + 1) % brandColors.length;
  copyrightNode.style.color = brandColors[activeColorIndex];
};

// Global Pipeline Triggers
sendBtn.onclick = handleSend;
userInput.addEventListener("keydown", e => { if(e.key === "Enter") handleSend(); });

initTheme();
loadSettings();
loadChat();
</script>
