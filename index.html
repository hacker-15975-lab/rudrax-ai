<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>rudrax</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* Android 16 / Material You Inspired Minimal UI */
:root {
  --sys-bg: #141414;
  --sys-surface: #1e1e1e;
  --sys-surface-variant: #2d2d2d;
  --sys-primary: #a8c7fa;
  --sys-on-primary: #062e6f;
  --sys-text: #e2e2e2;
  --sys-text-muted: #8e8e8e;
  --sys-border: rgba(255, 255, 255, 0.08);
  --sys-msg-user: #a8c7fa;
  --sys-msg-bot: #1e1e1e;
  --sys-on-msg-user: #062e6f;
  --sys-radius-large: 28px;
  --sys-radius-medium: 16px;
}

[data-theme="light"] {
  --sys-bg: #fdfdfd;
  --sys-surface: #f0f2f5;
  --sys-surface-variant: #e1e3e6;
  --sys-primary: #0b57d0;
  --sys-on-primary: #ffffff;
  --sys-text: #1a1a1a;
  --sys-text-muted: #5e5e5e;
  --sys-border: rgba(0, 0, 0, 0.08);
  --sys-msg-user: #d3e3fd;
  --sys-msg-bot: #f0f2f5;
  --sys-on-msg-user: #041e49;
}

[data-theme="amoled"] {
  --sys-bg: #000000;
  --sys-surface: #0a0a0a;
  --sys-surface-variant: #141414;
  --sys-primary: #8ab4f8;
  --sys-on-primary: #000000;
  --sys-text: #ffffff;
  --sys-text-muted: #707070;
  --sys-border: rgba(255, 255, 255, 0.05);
  --sys-msg-user: #1a73e8;
  --sys-msg-bot: #0a0a0a;
  --sys-on-msg-user: #ffffff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0; padding: 0;
}

html, body {
  /* Forces full screen, prevents header push-up on mobile keyboard */
  height: 100%; width: 100%;
  position: fixed; top: 0; left: 0; overflow: hidden;
  font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  background-color: var(--sys-bg);
  color: var(--sys-text);
  transition: background-color 0.4s ease, color 0.4s ease;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--sys-surface-variant); border-radius: 10px; }

/* Main Layout */
.app-container {
  display: flex; flex-direction: column;
  height: 100%; width: 100%; position: relative;
}

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--sys-bg);
  z-index: 10;
  padding-top: max(12px, env(safe-area-inset-top));
}

.icon-btn {
  background: transparent; border: none;
  color: var(--sys-text);
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.2s;
}
.icon-btn:active { background: var(--sys-surface-variant); }

/* Stylish Dropdown */
.model-selector {
  display: flex; align-items: center; gap: 6px;
  background: var(--sys-surface);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px; font-weight: 500;
  color: var(--sys-text);
  cursor: pointer; border: 1px solid var(--sys-border);
  transition: 0.2s;
  max-width: 60%;
}
.model-selector span {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.model-selector:active { transform: scale(0.97); }

.chat-container {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 20px 100px 20px;
  display: flex; flex-direction: column; gap: 20px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%; padding: 14px 18px;
  border-radius: var(--sys-radius-large);
  font-size: 15px; line-height: 1.5;
  word-wrap: break-word;
  animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.msg p { margin: 0 0 10px 0; }
.msg p:last-child { margin: 0; }
.msg pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; overflow-x: auto; margin: 8px 0; }
.msg code { font-family: monospace; font-size: 13px; }

.user {
  align-self: flex-end;
  background: var(--sys-msg-user);
  color: var(--sys-on-msg-user);
  border-bottom-right-radius: 6px;
}
.bot {
  align-self: flex-start;
  background: var(--sys-msg-bot);
  border: 1px solid var(--sys-border);
  color: var(--sys-text);
  border-bottom-left-radius: 6px;
}

@keyframes slideUp {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Input Area */
.input-area {
  position: absolute; bottom: 0; left: 0; width: 100%;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--sys-bg) 70%, transparent);
  display: flex; justify-content: center;
}

.input-wrapper {
  display: flex; align-items: flex-end;
  background: var(--sys-surface);
  border: 1px solid var(--sys-border);
  padding: 6px 6px 6px 12px;
  border-radius: var(--sys-radius-large);
  width: 100%; max-width: 800px;
  transition: 0.3s;
}
.input-wrapper:focus-within { border-color: var(--sys-primary); }

.input-field {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--sys-text); font-size: 15px;
  padding: 12px 8px; font-family: inherit;
  resize: none; max-height: 120px; min-height: 44px;
}
.input-field::placeholder { color: var(--sys-text-muted); }

.send-btn {
  background: var(--sys-primary); color: var(--sys-on-primary);
  border: none; border-radius: 50%;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  opacity: 0; transform: scale(0.5); pointer-events: none;
  flex-shrink: 0;
}
.send-btn.active { opacity: 1; transform: scale(1); pointer-events: auto; }

.image-preview { max-width: 100%; border-radius: 12px; margin-top: 8px; }
.attached-image-container { position: absolute; bottom: 80px; left: 24px; max-width: 80px; border-radius: 12px; overflow: hidden; display: none; border: 2px solid var(--sys-primary); z-index: 20;}
.attached-image-container img { width: 100%; display: block; }
.remove-img-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* Sidebar & Modals */
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 99;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.sidebar {
  position: fixed; top: 0; left: 0; height: 100%; width: 320px;
  background: var(--sys-bg); transform: translateX(-100%);
  transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
  z-index: 100; border-right: 1px solid var(--sys-border);
}
.sidebar.open { transform: translateX(0); }

.sidebar-content { flex: 1; overflow-y: auto; padding: 24px 20px; }
.sidebar h3 { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: var(--sys-text); display: flex; align-items: center; gap: 8px;}

.group { background: var(--sys-surface); padding: 16px; border-radius: var(--sys-radius-medium); margin-bottom: 16px; border: 1px solid var(--sys-border); }

.input-box {
  width: 100%; padding: 14px 16px; margin-bottom: 12px;
  border-radius: 12px; border: 1px solid var(--sys-border);
  background: var(--sys-bg); color: var(--sys-text);
  font-size: 14px; outline: none; transition: 0.2s; font-family: inherit;
}
.input-box:focus { border-color: var(--sys-primary); }

.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: var(--sys-surface-variant); color: var(--sys-text);
  font-weight: 500; font-size: 15px; cursor: pointer;
  transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; font-family: inherit;
}
.btn-primary { background: var(--sys-primary); color: var(--sys-on-primary); }
.btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff453a; }
.btn:active { transform: scale(0.98); }

/* Model Management */
.model-item { display: flex; justify-content: space-between; align-items: center; background: var(--sys-bg); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
.model-item button { background: none; border: none; color: #ff453a; cursor: pointer; padding: 4px; }
.add-model-row { display: flex; gap: 8px; margin-top: 12px; }
.add-model-row input { flex: 1; margin: 0; }

/* Custom Dropdown Modal */
.dropdown-modal {
  position: fixed; bottom: 0; left: 0; width: 100%;
  background: var(--sys-surface);
  border-radius: 24px 24px 0 0;
  padding: 20px; z-index: 101;
  transform: translateY(100%); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  max-height: 70vh; display: flex; flex-direction: column;
}
.dropdown-modal.open { transform: translateY(0); }
.dropdown-header { font-size: 18px; font-weight: 500; margin-bottom: 16px; text-align: center; }
.dropdown-list { overflow-y: auto; flex: 1; }
.dropdown-option {
  padding: 16px; border-radius: 12px; margin-bottom: 8px;
  background: var(--sys-bg); cursor: pointer;
  transition: 0.2s; font-size: 15px;
}
.dropdown-option:active { background: var(--sys-surface-variant); }
.dropdown-option.selected { background: var(--sys-primary); color: var(--sys-on-primary); }

/* Copyright Footer */
.copyright {
  text-align: center; font-size: 12px; padding: 16px;
  color: var(--sys-text-muted); cursor: pointer;
  border-top: 1px solid var(--sys-border);
  user-select: none; transition: color 0.3s;
}

</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-content">
    
    <div class="group">
      <h3>Actions</h3>
      <button class="btn btn-primary" onclick="newChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Chat
      </button>
      <button class="btn btn-danger" onclick="deleteChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Clear History
      </button>
    </div>

    <div class="group">
      <h3>API Configuration</h3>
      <input class="input-box" id="api1" placeholder="OpenRouter Key 1" type="password">
      <input class="input-box" id="api2" placeholder="OpenRouter Key 2 (Fallback)" type="password">
      <textarea class="input-box" id="systemPrompt" rows="3" placeholder="System Prompt / Personality"></textarea>
      <button class="btn btn-primary" onclick="saveSettings()">Save Config</button>
    </div>

    <div class="group">
      <h3>Manage Models</h3>
      <div id="modelListContainer"></div>
      <div class="add-model-row">
        <input class="input-box" id="newModelInput" placeholder="ex: openai/gpt-4o">
        <button class="btn" style="width: auto; padding: 0 16px;" onclick="addCustomModel()">Add</button>
      </div>
    </div>
  </div>
  
  <div class="copyright" id="copyrightText">All Rights Reserved © Tapojit Mondal</div>
</div>

<div class="dropdown-modal" id="modelDropdown">
  <div class="dropdown-header">Select Model</div>
  <div class="dropdown-list" id="dropdownList"></div>
</div>

<div class="app-container">
  
  <div class="header">
    <button class="icon-btn" id="hamburger">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </button>
    
    <div class="model-selector" id="modelSelectorBtn">
      <span id="currentModelDisplay">Select Model</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>

    <button class="icon-btn" id="themeBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="attached-image-container" id="attachedImgBox">
    <img id="attachedImgPreview" src="" alt="attachment">
    <button class="remove-img-btn" onclick="removeImage()">✕</button>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <button class="icon-btn" style="margin-bottom: 2px;" onclick="document.getElementById('imageUpload').click()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sys-text-muted)" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      </button>
      <input type="file" id="imageUpload" accept="image/*" style="display:none">
      
      <input type="text" class="input-field" id="userInput" placeholder="Message rudrax..." autocomplete="off">
      
      <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

</div>

<script>
// Default Setup
const defaultModels = [
  "poolside/laguna-m.1:free", "poolside/laguna-xs.2:free", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free",
  "openrouter/owl-alpha", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free", "moonshotai/kimi-k2.6:free",
  "deepseek/deepseek-v4-flash:free", "nvidia/nemotron-nano-12b-v2-vl:free", "nvidia/nemotron-3-nano-30b-a3b:free",
  "liquid/lfm-2.5-1.2b-instruct:free", "liquid/lfm-2.5-1.2b-thinking:free", "nvidia/nemotron-3-super-120b-a12b:free",
  "openai/gpt-oss-20b:free", "openai/gpt-oss-120b:free", "nvidia/nemotron-nano-9b-v2:free", "qwen/qwen3-next-80b-a3b-instruct:free",
  "meta-llama/llama-3.2-3b-instruct:free", "meta-llama/llama-3.3-70b-instruct:free", "cognitivecomputations/dolphin-mistral-24b-venice-edition:free",
  "qwen/qwen3-coder:free", "z-ai/glm-4.5-air:free", "nousresearch/hermes-3-llama-3.1-405b:free", "nvidia/llama-nemotron-embed-vl-1b-v2:free"
];
const themes = ["dark", "light", "amoled"];

// DOM Elements
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const hamburger = document.getElementById('hamburger');
const chatContainer = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const imageUpload = document.getElementById('imageUpload');
const modelDropdown = document.getElementById('modelDropdown');
const dropdownList = document.getElementById('dropdownList');
const modelSelectorBtn = document.getElementById('modelSelectorBtn');
const currentModelDisplay = document.getElementById('currentModelDisplay');
const attachedImgBox = document.getElementById('attachedImgBox');
const attachedImgPreview = document.getElementById('attachedImgPreview');
const copyrightText = document.getElementById('copyrightText');
const themeBtn = document.getElementById('themeBtn');

// State
let savedModels = JSON.parse(localStorage.getItem("rudrax_models")) || [...defaultModels];
let selectedModel = localStorage.getItem("rudrax_selected_model") || savedModels[0];
let currentThemeIndex = themes.indexOf(localStorage.getItem("rudrax_theme") || "dark");
let currentImage = null;

// Initialization
function init() {
  applyTheme();
  loadSettings();
  loadChat();
  renderModelManagement();
  renderDropdown();
  updateModelDisplay();
}

// UI Handlers
hamburger.onclick = () => openModal(sidebar);
overlay.onclick = closeAllModals;
modelSelectorBtn.onclick = () => openModal(modelDropdown);

function openModal(element) {
  overlay.classList.add('active');
  element.classList.add('open');
}
function closeAllModals() {
  overlay.classList.remove('active');
  sidebar.classList.remove('open');
  modelDropdown.classList.remove('open');
}

// Theme Management
function applyTheme() {
  document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
  localStorage.setItem("rudrax_theme", themes[currentThemeIndex]);
}
themeBtn.onclick = () => {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  applyTheme();
};

// Copyright Color Logic
copyrightText.addEventListener('click', () => {
  const randomColor = `hsl(${Math.random() * 360}, 100%, 65%)`;
  copyrightText.style.color = randomColor;
});

// Encryption
function encrypt(text){ return btoa(unescape(encodeURIComponent(text))); }
function decrypt(text){ return decodeURIComponent(escape(atob(text))); }

// Settings Management
function saveSettings(){
  localStorage.setItem("rudrax_settings", encrypt(JSON.stringify({
    system: document.getElementById("systemPrompt").value,
    keys: [document.getElementById("api1").value, document.getElementById("api2").value]
  })));
  closeAllModals();
}

function loadSettings(){
  const data = localStorage.getItem("rudrax_settings");
  if(!data) return;
  try {
    const s = JSON.parse(decrypt(data));
    document.getElementById("systemPrompt").value = s.system || "";
    document.getElementById("api1").value = s.keys[0] || "";
    document.getElementById("api2").value = s.keys[1] || "";
  } catch(e) {}
}

// Model Management
function renderModelManagement() {
  const container = document.getElementById('modelListContainer');
  container.innerHTML = "";
  savedModels.forEach((m, index) => {
    const div = document.createElement('div');
    div.className = 'model-item';
    div.innerHTML = `<span>${m}</span> <button onclick="removeModel(${index})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`;
    container.appendChild(div);
  });
}

function addCustomModel() {
  const input = document.getElementById('newModelInput');
  const val = input.value.trim();
  if(val && !savedModels.includes(val)) {
    savedModels.push(val);
    localStorage.setItem("rudrax_models", JSON.stringify(savedModels));
    input.value = "";
    renderModelManagement();
    renderDropdown();
  }
}

function removeModel(index) {
  if (savedModels[index] === selectedModel) {
    selectedModel = savedModels[0] || "";
    localStorage.setItem("rudrax_selected_model", selectedModel);
    updateModelDisplay();
  }
  savedModels.splice(index, 1);
  localStorage.setItem("rudrax_models", JSON.stringify(savedModels));
  renderModelManagement();
  renderDropdown();
}

// Custom Dropdown Render
function renderDropdown() {
  dropdownList.innerHTML = "";
  savedModels.forEach(m => {
    const div = document.createElement('div');
    div.className = `dropdown-option ${m === selectedModel ? 'selected' : ''}`;
    div.innerText = m;
    div.onclick = () => {
      selectedModel = m;
      localStorage.setItem("rudrax_selected_model", selectedModel);
      updateModelDisplay();
      renderDropdown();
      closeAllModals();
    };
    dropdownList.appendChild(div);
  });
}

function updateModelDisplay() {
  currentModelDisplay.innerText = selectedModel || "Select Model";
}

// Chat Management
function saveChat(){ localStorage.setItem("rudrax_chat", chatContainer.innerHTML); }
function loadChat(){ chatContainer.innerHTML = localStorage.getItem("rudrax_chat") || ""; scrollBottom(); }
function newChat() { chatContainer.innerHTML = ""; saveChat(); closeAllModals(); }
function deleteChat() { localStorage.removeItem("rudrax_chat"); chatContainer.innerHTML = ""; closeAllModals(); }
function scrollBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

// Input Logic
userInput.addEventListener('input', () => {
  if(userInput.value.trim().length > 0 || currentImage) sendBtn.classList.add('active');
  else sendBtn.classList.remove('active');
});

imageUpload.onchange = () => {
  const file = imageUpload.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = e => {
      currentImage = e.target.result;
      attachedImgPreview.src = currentImage;
      attachedImgBox.style.display = "block";
      sendBtn.classList.add('active');
    }
    reader.readAsDataURL(file);
  }
}

function removeImage() {
  currentImage = null;
  attachedImgBox.style.display = "none";
  imageUpload.value = "";
  if(userInput.value.trim().length === 0) sendBtn.classList.remove('active');
}

function addMessage(text, type, isHtml = false){
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.innerHTML = isHtml ? text : text;
  chatContainer.appendChild(div);
  scrollBottom();
  saveChat();
  return div;
}

// AI Streaming with Anti-Flicker (Throttled DOM update)
async function streamResponse(model, key, messages, botDiv){
  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
    body: JSON.stringify({ model, messages, stream: true })
  });
  
  if(!response.ok) throw new Error("API Error");

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let fullText = "";
  let renderFrame = null;
  
  while(true){
    const {done, value} = await reader.read();
    if(done) {
      if(renderFrame) cancelAnimationFrame(renderFrame);
      botDiv.innerHTML = marked.parse(fullText); // Final render
      saveChat();
      break;
    }
    const chunk = decoder.decode(value);
    const lines = chunk.split("\n");
    
    for(let line of lines){
      if(line.startsWith("data:")){
        const data = line.replace("data:", "").trim();
        if(data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          if(json.choices[0].delta.content) {
            fullText += json.choices[0].delta.content;
            
            // Anti-flicker: Update DOM using requestAnimationFrame
            if(!renderFrame) {
              renderFrame = requestAnimationFrame(() => {
                botDiv.innerHTML = marked.parse(fullText);
                scrollBottom();
                renderFrame = null;
              });
            }
          }
        } catch(e) {}
      }
    }
  }
}

async function handleSend(){
  let msg = userInput.value.trim();
  if(!msg && !currentImage) return;
  userInput.value = "";
  sendBtn.classList.remove('active');

  let displayMsg = msg;
  if(currentImage) {
    displayMsg += `<br><img src="${currentImage}" class="image-preview">`;
    removeImage(); // Clear attachment UI
  }
  
  addMessage(displayMsg, "user", true);
  const botDiv = addMessage('<span style="color:var(--sys-text-muted)">Thinking...</span>', "bot", true);

  const settingsData = localStorage.getItem("rudrax_settings");
  if(!settingsData || !selectedModel) {
    botDiv.innerHTML = "Please select a model and add an API key in settings.";
    return;
  }
  
  const settings = JSON.parse(decrypt(settingsData));
  const keys = settings.keys.filter(k => k);
  if(keys.length === 0) {
    botDiv.innerHTML = "Please configure your API keys.";
    return;
  }

  let messages = [{role: "system", content: settings.system || "You are rudrax, a helpful AI assistant."}];
  
  // Need to extract history (simplified version for this UI)
  messages.push({
    role: "user", 
    content: currentImage && displayMsg.includes("<img") 
      ? [{type: "text", text: msg || "Analyze this image"}, {type: "image_url", image_url: {url: currentImage}}]
      : msg
  });

  let success = false;
  for(let key of keys){
    try {
      botDiv.innerHTML = ""; 
      await streamResponse(selectedModel, key, messages, botDiv);
      success = true;
      break;
    } catch(e) {
      console.log("Switching key due to error...");
    }
  }
  
  if(!success) {
    botDiv.innerHTML = "Error connecting to model. Check API keys or try another model.";
    saveChat();
  }
}

sendBtn.onclick = handleSend;
userInput.addEventListener("keydown", e => { if(e.key === "Enter") handleSend(); });

init();
</script>
