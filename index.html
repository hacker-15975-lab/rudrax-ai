<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>rudrax</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  /* Default Dark Theme */
  --bg-color: #09090b;
  --surface: rgba(24, 24, 27, 0.65);
  --surface-solid: #18181b;
  --border: rgba(255, 255, 255, 0.08);
  --primary: #2563eb;
  --primary-hover: #3b82f6;
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  --msg-user: #2563eb;
  --msg-bot: rgba(39, 39, 42, 0.5);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  --danger: #ef4444;
}

[data-theme="light"] {
  --bg-color: #f4f4f5;
  --surface: rgba(255, 255, 255, 0.7);
  --surface-solid: #ffffff;
  --border: rgba(0, 0, 0, 0.1);
  --primary: #007AFF;
  --primary-hover: #0056D6;
  --text-main: #18181b;
  --text-muted: #71717a;
  --msg-user: #007AFF;
  --msg-bot: rgba(255, 255, 255, 0.8);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
}

[data-theme="amoled"] {
  --bg-color: #000000;
  --surface: rgba(10, 10, 10, 0.8);
  --surface-solid: #0a0a0a;
  --border: rgba(255, 255, 255, 0.1);
  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --text-main: #ffffff;
  --text-muted: #9ca3af;
  --msg-user: #3b82f6;
  --msg-bot: rgba(15, 15, 15, 0.9);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  height: 100dvh;
  display: flex;
  overflow: hidden;
  transition: background-color 0.4s ease, color 0.4s ease;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Typography & Base Forms */
h3, h4 { font-weight: 600; letter-spacing: 0.3px; color: var(--text-main); }
input, textarea, button { font-family: inherit; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--border);
}

/* Sidebar Styling */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  height: 100%;
  width: 320px;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  padding: 24px 20px;
  overflow-y: auto;
  z-index: 1000;
  border-right: 1px solid var(--border);
  border-radius: 0 28px 28px 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: var(--shadow);
}
.sidebar.open { transform: translateX(0); }

.sidebar-section { display: flex; flex-direction: column; gap: 12px; }
.sidebar-section h4 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

.input-box {
  width: 100%;
  padding: 14px 16px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: rgba(128, 128, 128, 0.08);
  color: var(--text-main);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.input-box:focus { border-color: var(--primary); background: rgba(128, 128, 128, 0.12); }

.action-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 16px;
  background: var(--primary);
  color: #fff;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.action-btn:active { transform: scale(0.97); }
.action-btn.danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

/* Custom Model List in Sidebar */
.model-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
  padding-right: 4px;
}
.model-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(128, 128, 128, 0.05);
  border-radius: 12px;
  font-size: 13px;
  border: 1px solid var(--border);
}
.model-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.model-item button {
  background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px; border-radius: 50%; display:flex;
}
.add-model-wrapper { display: flex; gap: 8px; }
.add-model-wrapper .input-box { flex: 1; }
.add-model-wrapper .add-btn {
  background: var(--primary); color: #fff; border: none; border-radius: 16px; width: 48px; cursor: pointer; display:flex; align-items:center; justify-content:center;
}

.copyright {
  margin-top: auto;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 10px 0;
  transition: color 0.3s;
  user-select: none;
}

/* Overlay */
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 999;
}
.overlay.active { opacity: 1; pointer-events: auto; }

/* Main Interface */
.main { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }

/* Header & Dropdown */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  position: relative;
  z-index: 500;
  border-bottom: 1px solid var(--border);
}
.header-left, .header-right { display: flex; align-items: center; gap: 16px; }

.icon-btn {
  background: none; border: none; color: var(--text-main); cursor: pointer;
  padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.icon-btn:active { background: rgba(128,128,128,0.2); }

.custom-dropdown { position: relative; }
.dropdown-selected {
  padding: 8px 16px;
  background: rgba(128, 128, 128, 0.1);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 200px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: 0.2s;
}
.dropdown-selected:active { transform: scale(0.97); }
.dropdown-options {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  max-height: 300px;
  overflow-y: auto;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 600;
  padding: 8px;
}
.custom-dropdown.active .dropdown-options { opacity: 1; pointer-events: auto; top: calc(100% + 12px); }
.dropdown-option {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text-main);
  transition: background 0.2s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dropdown-option:hover { background: rgba(128,128,128,0.1); }
.dropdown-option.active { color: var(--primary); background: rgba(37, 99, 235, 0.1); font-weight: 600; }

/* Chat Container */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 110px; /* Space for input */
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%;
  padding: 14px 18px;
  border-radius: 24px;
  line-height: 1.6;
  font-size: 15px;
  word-wrap: break-word;
  animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  /* Flicker Prevention */
  transform: translateZ(0);
}
.msg p { margin: 0 0 10px 0; }
.msg p:last-child { margin: 0; }
.msg pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; overflow-x: auto; margin: 10px 0; }
.msg code { font-family: ui-monospace, monospace; font-size: 13.5px; }
.msg:not(pre) code { background: rgba(128,128,128,0.2); padding: 2px 6px; border-radius: 6px; }

.user {
  align-self: flex-end;
  background: var(--msg-user);
  color: #fff;
  border-bottom-right-radius: 6px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
}
.bot {
  align-self: flex-start;
  background: var(--msg-bot);
  border: 1px solid var(--border);
  color: var(--text-main);
  border-bottom-left-radius: 6px;
}

@keyframes fadeIn {
  0% { opacity: 0; transform: translateY(10px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Input Area */
.input-area {
  position: absolute;
  bottom: 0; left: 0; width: 100%;
  padding: 16px 20px 24px;
  background: linear-gradient(to top, var(--bg-color) 60%, transparent);
  display: flex;
  justify-content: center;
  z-index: 100;
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  padding: 8px 8px 8px 16px;
  border-radius: 28px;
  width: 100%;
  max-width: 800px;
  box-shadow: var(--shadow);
  gap: 8px;
  transition: all 0.3s ease;
}

.input-field {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: 15px;
  padding: 12px 0;
  max-height: 120px;
  resize: none;
  font-family: inherit;
  line-height: 1.4;
}
.input-field::placeholder { color: var(--text-muted); }

.send-btn {
  background: var(--text-muted);
  color: var(--bg-color);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  flex-shrink: 0;
  opacity: 0.6;
}
.send-btn svg { width: 18px; height: 18px; }
.send-btn.active {
  background: var(--primary);
  color: #fff;
  opacity: 1;
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}
.send-btn:active { transform: scale(0.95); }

.input-icon-btn {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  padding: 10px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, background 0.2s;
  flex-shrink: 0;
}
.input-icon-btn:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }

.image-preview-wrapper { margin-top: 10px; position: relative; display: inline-block; }
.image-preview { max-width: 200px; border-radius: 12px; border: 1px solid var(--border); }
.remove-img-btn {
  position: absolute; top: -8px; right: -8px; background: var(--surface-solid); border: 1px solid var(--border); color: var(--text-main);
  border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display:flex; align-items:center; justify-content:center; font-size:12px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="sidebar glass" id="sidebar">
  <div class="sidebar-section">
    <h4>Chat Settings</h4>
    <button class="action-btn" onclick="clearChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
    <button class="action-btn danger" onclick="deleteChatHistory()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Clear History
    </button>
  </div>

  <div class="sidebar-section">
    <h4>System Profile</h4>
    <textarea class="input-box" id="systemPrompt" rows="3" placeholder="Define AI behavior..."></textarea>
  </div>

  <div class="sidebar-section">
    <h4>API Keys</h4>
    <input class="input-box" id="api1" placeholder="OpenRouter API Key 1" type="password">
    <input class="input-box" id="api2" placeholder="OpenRouter API Key 2 (Optional)" type="password">
    <input class="input-box" id="api3" placeholder="OpenRouter API Key 3 (Optional)" type="password">
  </div>

  <div class="sidebar-section" style="flex:1;">
    <h4>Model Management</h4>
    <div class="add-model-wrapper">
      <input type="text" id="newModelInput" class="input-box" placeholder="e.g. openai/gpt-4o">
      <button class="add-btn" onclick="addNewModel()">+</button>
    </div>
    <div class="model-list" id="sidebarModelList"></div>
  </div>

  <button class="action-btn" onclick="saveSettings()">Save Configurations</button>

  <div id="copyrightText" class="copyright">All Rights Reserved © Tapojit Mondal</div>
</div>

<div class="main">
  <div class="header glass">
    <div class="header-left">
      <button class="icon-btn" id="hamburger">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="custom-dropdown" id="modelDropdown">
      <div class="dropdown-selected" id="dropdownSelected">
        <span id="activeModelName">Select Model</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="dropdown-options" id="dropdownOptions"></div>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="themeToggleBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
    </div>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="input-area">
    <div class="input-wrapper glass">
      <button class="input-icon-btn" onclick="document.getElementById('imageUpload').click()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </button>
      <input type="file" id="imageUpload" accept="image/*" style="display:none">
      
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <div id="imagePreviewContainer" style="display:none;" class="image-preview-wrapper">
          <img id="imgPreview" class="image-preview" src="" alt="upload">
          <button class="remove-img-btn" onclick="removeImage()">✕</button>
        </div>
        <textarea class="input-field" id="userInput" rows="1" placeholder="Message rudrax..."></textarea>
      </div>

      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<script>
// Configure Marked.js for better formatting
marked.setOptions({ breaks: true, gfm: true });

// Elements
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const hamburger = document.getElementById('hamburger');
const chatContainer = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const imageUpload = document.getElementById('imageUpload');
const imgPreviewContainer = document.getElementById('imagePreviewContainer');
const imgPreview = document.getElementById('imgPreview');

// State
let currentImage = null;
let activeModel = "";
let modelsArray = [];
const themes = ['dark', 'light', 'amoled'];
let currentThemeIndex = 0;

const defaultModels = [
  "poolside/laguna-m.1:free", "poolside/laguna-xs.2:free", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free",
  "openrouter/owl-alpha", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free",
  "moonshotai/kimi-k2.6:free", "deepseek/deepseek-v4-flash:free", "nvidia/nemotron-nano-12b-v2-vl:free",
  "nvidia/nemotron-3-nano-30b-a3b:free", "liquid/lfm-2.5-1.2b-instruct:free", "liquid/lfm-2.5-1.2b-thinking:free",
  "nvidia/nemotron-3-super-120b-a12b:free", "openai/gpt-oss-20b:free", "openai/gpt-oss-120b:free",
  "nvidia/nemotron-nano-9b-v2:free", "qwen/qwen3-next-80b-a3b-instruct:free", "meta-llama/llama-3.2-3b-instruct:free",
  "meta-llama/llama-3.3-70b-instruct:free", "cognitivecomputations/dolphin-mistral-24b-venice-edition:free",
  "qwen/qwen3-coder:free", "z-ai/glm-4.5-air:free", "nousresearch/hermes-3-llama-3.1-405b:free",
  "nvidia/llama-nemotron-embed-vl-1b-v2:free"
];

// UI Interactions
hamburger.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('active'); }
overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.getElementById('modelDropdown').classList.remove('active'); }

document.getElementById('dropdownSelected').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('modelDropdown').classList.toggle('active');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('.custom-dropdown')) {
    document.getElementById('modelDropdown').classList.remove('active');
  }
});

// Auto-resize textarea
userInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
  toggleSendButton();
});

function toggleSendButton() {
  if (userInput.value.trim().length > 0 || currentImage) {
    sendBtn.classList.add('active');
  } else {
    sendBtn.classList.remove('active');
  }
}

// Security
const encrypt = (text) => btoa(encodeURIComponent(text));
const decrypt = (text) => decodeURIComponent(atob(text));

// Theming
document.getElementById('themeToggleBtn').onclick = () => {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
  localStorage.setItem('rudrax_theme', themes[currentThemeIndex]);
};


// Settings & Models Logic
function loadSettings() {
  const savedTheme = localStorage.getItem('rudrax_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  currentThemeIndex = themes.indexOf(savedTheme) > -1 ? themes.indexOf(savedTheme) : 0;

  let storedModels = JSON.parse(localStorage.getItem('rudrax_models'));
  modelsArray = storedModels && storedModels.length > 0 ? storedModels : [...defaultModels];
  
  activeModel = localStorage.getItem('rudrax_active_model') || modelsArray[0];

  const data = localStorage.getItem("rudrax_settings");
  if(data) {
    try {
      const s = JSON.parse(decrypt(data));
      document.getElementById("systemPrompt").value = s.system || "";
      document.getElementById("api1").value = s.keys[0] || "";
      document.getElementById("api2").value = s.keys[1] || "";
      document.getElementById("api3").value = s.keys[2] || "";
    } catch(e) {}
  }
  
  renderModels();
}

function saveSettings() {
  localStorage.setItem("rudrax_settings", encrypt(JSON.stringify({
    system: document.getElementById("systemPrompt").value,
    keys: [
      document.getElementById("api1").value,
      document.getElementById("api2").value,
      document.getElementById("api3").value
    ]
  })));
  localStorage.setItem('rudrax_models', JSON.stringify(modelsArray));
  localStorage.setItem('rudrax_active_model', activeModel);
  sidebar.classList.remove('open'); overlay.classList.remove('active');
}

function renderModels() {
  // Sidebar List
  const sidebarList = document.getElementById('sidebarModelList');
  sidebarList.innerHTML = '';
  modelsArray.forEach((model, index) => {
    const div = document.createElement('div');
    div.className = 'model-item';
    div.innerHTML = `<span>${model}</span> <button onclick="removeModel(${index})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`;
    sidebarList.appendChild(div);
  });

  // Header Dropdown
  const dropdownOpts = document.getElementById('dropdownOptions');
  dropdownOpts.innerHTML = '';
  modelsArray.forEach(model => {
    const div = document.createElement('div');
    div.className = `dropdown-option ${model === activeModel ? 'active' : ''}`;
    div.innerText = model;
    div.onclick = () => {
      activeModel = model;
      localStorage.setItem('rudrax_active_model', activeModel);
      renderModels();
      document.getElementById('modelDropdown').classList.remove('active');
    };
    dropdownOpts.appendChild(div);
  });

  document.getElementById('activeModelName').innerText = activeModel || "Select Model";
}

function addNewModel() {
  const input = document.getElementById('newModelInput');
  const val = input.value.trim();
  if (val && !modelsArray.includes(val)) {
    modelsArray.unshift(val);
    input.value = '';
    if(!activeModel) activeModel = val;
    renderModels();
  }
}

function removeModel(index) {
  if(modelsArray[index] === activeModel) activeModel = modelsArray[0] !== activeModel ? modelsArray[0] : (modelsArray[1] || "");
  modelsArray.splice(index, 1);
  renderModels();
}

// Chat Management
function saveChat(){ localStorage.setItem("rudrax_chat", chatContainer.innerHTML); }
function loadChat(){ chatContainer.innerHTML = localStorage.getItem("rudrax_chat") || ""; scrollChat(); }

function clearChat() { chatContainer.innerHTML = ""; sidebar.classList.remove('open'); overlay.classList.remove('active'); saveChat(); }
function deleteChatHistory() { clearChat(); localStorage.removeItem("rudrax_chat"); }

function scrollChat() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }

function addMessage(text, type, isHtml = false){
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.innerHTML = isHtml ? text : (type === 'bot' ? marked.parse(text) : text);
  chatContainer.appendChild(div);
  scrollChat();
  saveChat();
  return div;
}

// Media Handling
imageUpload.onchange = () => {
  const file = imageUpload.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImage = e.target.result;
    imgPreview.src = currentImage;
    imgPreviewContainer.style.display = 'inline-block';
    toggleSendButton();
  }
  reader.readAsDataURL(file);
}

function removeImage() {
  currentImage = null;
  imgPreviewContainer.style.display = 'none';
  imageUpload.value = "";
  toggleSendButton();
}

// Core Chat Logic
async function streamResponse(model, keys, messages, botDiv) {
  let success = false;
  
  for(let key of keys) {
    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
        body: JSON.stringify({ model, messages, stream: true })
      });
      
      if(!response.ok) continue; // Try next key

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = "";
      
      while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");
        
        for(let line of lines) {
          if(line.startsWith("data:")) {
            const data = line.replace("data:", "").trim();
            if(data === "[DONE]") return true;
            try {
              const json = JSON.parse(data);
              if(json.choices[0].delta.content) {
                fullText += json.choices[0].delta.content;
                // Minor debounce optimization for smooth rendering
                botDiv.innerHTML = marked.parse(fullText);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              }
            } catch(e) {}
          }
        }
      }
      success = true;
      break; 
    } catch(e) {
      console.log("Switching key due to error...");
    }
  }
  return success;
}

async function handleSend() {
  let msg = userInput.value.trim();
  if(!msg && !currentImage) return;
  
  // Reset UI
  userInput.value = "";
  userInput.style.height = 'auto';
  sendBtn.classList.remove('active');
  
  let displayMsg = msg.replace(/\n/g, '<br>');
  if(currentImage) {
    displayMsg += `<br><img src="${currentImage}" class="image-preview" style="margin-top:8px;">`;
  }
  
  addMessage(displayMsg, "user", true);
  const botDiv = addMessage('<span style="color:var(--text-muted)">Thinking...</span>', "bot", true);

  const settingsData = localStorage.getItem("rudrax_settings");
  if(!settingsData) {
    botDiv.innerHTML = "Please configure settings (API keys) first.";
    return;
  }
  
  const settings = JSON.parse(decrypt(settingsData));
  const keys = settings.keys.filter(k => k);
  
  if(!activeModel) { botDiv.innerHTML = "Please select a model."; return; }
  if(keys.length === 0) { botDiv.innerHTML = "Please add an API key in settings."; return; }

  let messages = [{role: "system", content: settings.system || "You are a helpful AI."}];
  
  if(currentImage){
    messages.push({
      role: "user", 
      content: [
        {type: "text", text: msg || "Analyze this image"},
        {type: "image_url", image_url: {url: currentImage}}
      ]
    });
    removeImage();
  } else {
    messages.push({role: "user", content: msg});
  }

  botDiv.innerHTML = '<span style="color:var(--text-muted)">Generating...</span>';
  
  const success = await streamResponse(activeModel, keys, messages, botDiv);
  if(!success) botDiv.innerHTML = "All keys failed or model unavailable. Please check settings.";
  saveChat();
}

// Events
sendBtn.onclick = handleSend;
userInput.addEventListener("keydown", e => { 
  if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } 
});

// Copyright Magic Color
document.getElementById('copyrightText').addEventListener('click', (e) => {
  const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
  e.target.style.color = randomColor;
});

// Init
loadSettings();
loadChat();

</script>
